name: D3QN Python contracts

on:
  push:
    branches:
      - experiment/d3qn-native-mdp-v2
  pull_request:
    paths:
      - 'scripts/rl_rc_dot/d3qn_*.py'
      - 'scripts/rl_rc_dot/test_d3qn_native_v2.py'
      - 'notebooks/VVC_D3QN_Native_Mini16_Kaggle.ipynb'
      - '.github/workflows/D3QN-Python.yml'

jobs:
  d3qn-unit:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only ML test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.24,<3'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile standalone D3QN source
        run: |
          python -m py_compile scripts/rl_rc_dot/d3qn_method.py scripts/rl_rc_dot/d3qn_agent_v2.py scripts/rl_rc_dot/d3qn_native_env.py scripts/rl_rc_dot/d3qn_native_runner.py scripts/rl_rc_dot/test_d3qn_native_v2.py
      - name: Run D3QN MDP, reward and masked Double-Q tests
        run: python -m unittest scripts.rl_rc_dot.test_d3qn_native_v2 -v
