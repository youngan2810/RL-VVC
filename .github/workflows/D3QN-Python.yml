name: D3QN Python contracts

on:
  push:
    branches:
      - experiment/d3qn-native-mdp-v2
      - experiment/d3qn-v5-coding-cycle-state
      - experiment/d3qn-v6-action-conditioned-reconstruction
  pull_request:
    paths:
      - 'scripts/rl_rc_dot/d3qn_*.py'
      - 'scripts/rl_rc_dot/test_d3qn_native_v2.py'
      - 'scripts/rl_rc_dot/test_d3qn_native_v3.py'
      - 'scripts/rl_rc_dot/test_d3qn_native_v4.py'
      - 'scripts/rl_rc_dot/test_d3qn_native_v5.py'
      - 'scripts/rl_rc_dot/test_d3qn_v5_notebook.py'
      - 'scripts/rl_rc_dot/test_d3qn_v6_*.py'
      - 'scripts/rl_rc_dot/test_d3qn_v4_notebook.py'
      - 'scripts/rl_rc_dot/test_d3qn_v3_notebook.py'
      - 'notebooks/VVC_D3QN_Native_Mini16_Kaggle.ipynb'
      - 'notebooks/VVC_D3QN_V3_Mini16_Val4_LearningCheck_Kaggle.ipynb'
      - 'notebooks/VVC_D3QN_V4_TerminalReplay_Mini16_Val4_Kaggle.ipynb'
      - 'notebooks/VVC_D3QN_V5_CodingCycle_Mini16_Val4_Kaggle.ipynb'
      - 'notebooks/VVC_D3QN_V6_ActionConditioned_Mini16_Val4_Kaggle.ipynb'
      - '.github/workflows/D3QN-Python.yml'

jobs:
  d3qn-unit:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only ML test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.24,<3'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile standalone D3QN source
        run: |
          python -m py_compile scripts/rl_rc_dot/d3qn_method.py scripts/rl_rc_dot/d3qn_agent_v2.py scripts/rl_rc_dot/d3qn_native_env.py scripts/rl_rc_dot/d3qn_native_runner.py scripts/rl_rc_dot/test_d3qn_native_v2.py
          python -m py_compile scripts/rl_rc_dot/d3qn_agent_v3.py scripts/rl_rc_dot/d3qn_native_env_v3.py scripts/rl_rc_dot/d3qn_native_runner_v3.py scripts/rl_rc_dot/d3qn_verify_decoded.py scripts/rl_rc_dot/test_d3qn_native_v3.py
          python -m py_compile scripts/rl_rc_dot/d3qn_agent_v4.py scripts/rl_rc_dot/d3qn_native_runner_v4.py scripts/rl_rc_dot/test_d3qn_native_v4.py scripts/rl_rc_dot/test_d3qn_v4_notebook.py
          python -m py_compile scripts/rl_rc_dot/d3qn_state_v5.py scripts/rl_rc_dot/d3qn_native_env_v5.py scripts/rl_rc_dot/d3qn_agent_v5.py scripts/rl_rc_dot/d3qn_native_runner_v5.py scripts/rl_rc_dot/test_d3qn_native_v5.py scripts/rl_rc_dot/test_d3qn_v5_notebook.py
      - name: Run D3QN V2/V3/V4/V5 regressions and Kaggle notebook contract
        run: python -m unittest scripts.rl_rc_dot.test_d3qn_native_v2 scripts.rl_rc_dot.test_d3qn_native_v3 scripts.rl_rc_dot.test_d3qn_native_v4 scripts.rl_rc_dot.test_d3qn_native_v5 scripts.rl_rc_dot.test_d3qn_v3_notebook scripts.rl_rc_dot.test_d3qn_v4_notebook scripts.rl_rc_dot.test_d3qn_v5_notebook -v

  v6-pinned-handoff:
    name: V6 exact pinned-source Kaggle Gate B (CPU)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout notebook delivery branch HEAD
        uses: actions/checkout@v4
        with:
          path: delivery
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parse immutable source pin from delivered Kaggle notebook
        id: source
        run: |
          python - <<'PY'
          import json, pathlib, re, os
          p=pathlib.Path('delivery/notebooks/VVC_D3QN_V6_ActionConditioned_Mini16_Val4_Kaggle.ipynb')
          doc=json.loads(p.read_text(encoding='utf-8'))
          code='\n'.join(''.join(c['source']) for c in doc['cells'] if c['cell_type']=='code')
          pins=re.findall(r"^TRAINING_SOURCE_COMMIT='([a-f0-9]{40})'$",code,re.M)
          assert len(pins)==1, 'Kaggle notebook must contain exactly one immutable source SHA'
          assert pins[0]!='f10ec5de7c9a8b2bf3db561f6df46e9a8643eced', 'Historical V5 source forbidden'
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('sha='+pins[0]+'\n')
          print('V6_NOTEBOOK_PIN',pins[0])
          PY
      - name: Checkout EXACT training source commit into a fresh directory
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: pinned-source
          persist-credentials: false
      - name: Verify checkout SHA and mandatory module availability
        run: |
          test "$(git -C pinned-source rev-parse HEAD)" = "${{ steps.source.outputs.sha }}"
          test -f pinned-source/scripts/rl_rc_dot/test_d3qn_v6_notebook.py
          test -f pinned-source/scripts/rl_rc_dot/test_d3qn_v6_handoff.py
          test -f pinned-source/scripts/rl_rc_dot/d3qn_v6_handoff.py
          test -f pinned-source/scripts/rl_rc_dot/d3qn_v6_native_runner.py
          echo "EXACT_KAGGLE_SOURCE_PRECHECK_PASS ${{ steps.source.outputs.sha }}"
      - name: Install CPU testing and RGB conversion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.24,<3'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libswscale-dev libavutil-dev
      - name: Compile V6 code from pinned checkout
        working-directory: pinned-source
        run: |
          python -m py_compile scripts/rl_rc_dot/d3qn_v6_agent.py scripts/rl_rc_dot/d3qn_v6_diagnostics.py scripts/rl_rc_dot/d3qn_v6_native_runner.py scripts/rl_rc_dot/d3qn_v6_native_pair_probe.py scripts/rl_rc_dot/d3qn_v6_handoff.py scripts/rl_rc_dot/test_d3qn_v6_handoff.py scripts/rl_rc_dot/test_d3qn_v6_notebook.py
      - name: Execute EXACT Kaggle Gate B unittest command from pinned checkout
        working-directory: pinned-source
        env:
          V6_HANDOFF_NOTEBOOK: ${{ github.workspace }}/delivery/notebooks/VVC_D3QN_V6_ActionConditioned_Mini16_Val4_Kaggle.ipynb
          V6_EXPECTED_SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          python -m unittest \
            scripts.rl_rc_dot.test_d3qn_native_v2 \
            scripts.rl_rc_dot.test_d3qn_native_v3 \
            scripts.rl_rc_dot.test_d3qn_native_v4 \
            scripts.rl_rc_dot.test_d3qn_native_v5 \
            scripts.rl_rc_dot.test_d3qn_v6_reconstruction \
            scripts.rl_rc_dot.test_d3qn_v6_diagnostics \
            scripts.rl_rc_dot.test_d3qn_v6_handoff \
            scripts.rl_rc_dot.test_d3qn_v6_notebook -v
      - name: Execute Kaggle Gate B RGB709 parity from pinned checkout
        working-directory: pinned-source
        run: |
          python -c 'from scripts.rl_rc_dot.pixels import verify_conversion; print(verify_conversion())'
